<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Rooftop Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      background: #050b18;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
      overflow: hidden;
      max-width: 95vw;
    }
    .hud {
      width: 100%;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid #1e293b;
      font-weight: 700;
      font-size: 13px;
    }
    .hud .distance { color: #a855f7; }
    .hud .coins { color: #eab308; }
    .hud .best { color: #38bdf8; }
    canvas {
      display: block;
      background: #040814;
    }
    #overlay {
      position: absolute;
      top: 40px; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
    }
    #overlay.hidden { display: none; }
    h2 { font-size: 26px; color: #f8fafc; font-weight: 800; letter-spacing: -0.5px; }
    p { font-size: 13px; color: #94a3b8; text-align: center; max-width: 300px; line-height: 1.5; }
    .btn {
      background: #9333ea;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #a855f7; }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div class="distance">DIST: <span id="dist">0</span>m</div>
      <div class="coins">ORBS: <span id="orbs">0</span></div>
      <div class="best">RECORD: <span id="best">0</span>m</div>
    </div>
    <canvas id="canvas" width="600" height="340"></canvas>

    <div id="overlay">
      <h2 id="ov-title">CYBER RUNNER</h2>
      <p id="ov-desc">Press Space, Up Arrow, or Click to Jump! Tap twice for Double Jump. Avoid obstacles and leap across building roofs.</p>
      <button class="btn" id="start-btn">START RUN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const distEl = document.getElementById('dist');
    const orbsEl = document.getElementById('orbs');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let distance = 0;
    let orbs = 0;
    let bestDist = parseInt(localStorage.getItem('runner_best') || '0', 10);
    bestEl.textContent = bestDist;

    let speed = 5.5;
    let player = {
      x: 80,
      y: 220,
      w: 24,
      h: 36,
      vy: 0,
      jumpCount: 0,
      isGrounded: false
    };

    let buildings = [
      { x: 0, w: 300, y: 260, h: 80 },
      { x: 350, w: 280, y: 260, h: 80 },
      { x: 680, w: 320, y: 260, h: 80 }
    ];

    let obstacles = [];
    let items = [];
    let particles = [];

    function reset() {
      distance = 0;
      orbs = 0;
      speed = 5.5;
      player.x = 80;
      player.y = 210;
      player.vy = 0;
      player.jumpCount = 0;
      buildings = [
        { x: 0, w: 350, y: 260, h: 80 },
        { x: 400, w: 300, y: 260, h: 80 },
        { x: 740, w: 320, y: 260, h: 80 }
      ];
      obstacles = [];
      items = [];
      particles = [];
      distEl.textContent = '0';
      orbsEl.textContent = '0';
    }

    function jump() {
      if (!isPlaying) return;
      if (player.jumpCount < 2) {
        player.vy = -10.5;
        player.jumpCount++;
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: player.x + player.w / 2,
            y: player.y + player.h,
            vx: (Math.random() - 0.5) * 4,
            vy: Math.random() * 3 + 1,
            life: 1,
            color: '#a855f7'
          });
        }
      }
    }

    function update() {
      if (!isPlaying) return;

      distance += Math.round(speed * 0.1);
      distEl.textContent = distance;
      speed = 5.5 + Math.min(6, distance * 0.002);

      // Player Physics
      player.vy += 0.55; // Gravity
      player.y += player.vy;

      // Check Building landing
      player.isGrounded = false;
      buildings.forEach(b => {
        if (
          player.x + player.w > b.x &&
          player.x < b.x + b.w &&
          player.y + player.h >= b.y &&
          player.y + player.h <= b.y + 16 &&
          player.vy >= 0
        ) {
          player.y = b.y - player.h;
          player.vy = 0;
          player.jumpCount = 0;
          player.isGrounded = true;
        }
      });

      // Pit fall
      if (player.y > canvas.height + 40) {
        gameOver();
        return;
      }

      // Move Buildings
      buildings.forEach(b => { b.x -= speed; });
      const lastB = buildings[buildings.length - 1];
      if (lastB.x + lastB.w < canvas.width + 200) {
        const gap = Math.random() * 70 + 60;
        const width = Math.random() * 200 + 220;
        const newY = 240 + (Math.random() * 40 - 20);
        buildings.push({ x: lastB.x + lastB.w + gap, w: width, y: newY, h: canvas.height - newY });

        // Add obstacle or orbs
        if (Math.random() > 0.4) {
          obstacles.push({
            x: lastB.x + lastB.w + gap + width * 0.5,
            y: newY - 24,
            w: 18,
            h: 24
          });
        }
        if (Math.random() > 0.3) {
          items.push({
            x: lastB.x + lastB.w + gap + width * 0.75,
            y: newY - 45,
            r: 7
          });
        }
      }

      if (buildings[0].x + buildings[0].w < -50) {
        buildings.shift();
      }

      // Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= speed;
        if (o.x < -30) { obstacles.splice(i, 1); continue; }

        if (
          player.x < o.x + o.w &&
          player.x + player.w > o.x &&
          player.y < o.y + o.h &&
          player.y + player.h > o.y
        ) {
          gameOver();
          return;
        }
      }

      // Orbs
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.x -= speed;
        if (it.x < -30) { items.splice(i, 1); continue; }

        if (Math.hypot((player.x + player.w / 2) - it.x, (player.y + player.h / 2) - it.y) < 22) {
          orbs++;
          orbsEl.textContent = orbs;
          items.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Cyber backdrop skyline
      ctx.fillStyle = '#0a1024';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant buildings
      ctx.fillStyle = '#0f172a';
      for (let i = 0; i < 7; i++) {
        const h = 120 + (i % 3) * 30;
        ctx.fillRect(i * 90 - (distance * 0.2 % 90), canvas.height - h, 70, h);
      }

      // Buildings
      buildings.forEach(b => {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Neon edge line
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 6;
        ctx.fillRect(b.x, b.y, b.w, 3);
        ctx.shadowBlur = 0;
      });

      // Obstacles
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 8;
      obstacles.forEach(o => {
        ctx.fillRect(o.x, o.y, o.w, o.h);
      });
      ctx.shadowBlur = 0;

      // Orbs
      items.forEach(it => {
        ctx.fillStyle = '#eab308';
        ctx.shadowColor = '#eab308';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Player
      if (isPlaying) {
        ctx.fillStyle = '#c084fc';
        ctx.shadowColor = '#c084fc';
        ctx.shadowBlur = 10;
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // Visor
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(player.x + player.w - 8, player.y + 6, 6, 5);
        ctx.shadowBlur = 0;
      }

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1.0;
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      reset();
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function gameOver() {
      isPlaying = false;
      if (distance > bestDist) {
        bestDist = distance;
        bestEl.textContent = bestDist;
        localStorage.setItem('runner_best', bestDist);
      }
      ovTitle.textContent = 'RUN OVER';
      ovDesc.textContent = `Distance: ${distance}m · Energy Orbs: ${orbs}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') {
        jump();
        e.preventDefault();
      }
    });

    canvas.addEventListener('pointerdown', e => {
      jump();
      e.preventDefault();
    });

    loop();
  </script>
</body>
</html>
