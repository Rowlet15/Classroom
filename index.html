    <link id="tab-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M6 11h4V7H6v4zm0 6h4v-4H6v4zm6 0h4v-4h-4v4zm0-6h4V7h-4v4zm-6 8h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // 1. Ensure trailing slash on GitHub Pages so relative assets (./assets/...) resolve properly
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.endsWith('/') && !window.location.pathname.endsWith('.html')) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }

      // 2. Fallback: If deployed from root on 'main' branch without pre-building,
      // browsers cannot parse raw .tsx files. Detect if this is unbundled source HTML:
      (function() {
        if (!window.location.hostname.endsWith('github.io')) return;
        window.addEventListener('DOMContentLoaded', function() {
          var unbundledSrc = document.querySelector('script[src*="main.tsx"]');
          if (unbundledSrc && !window.location.pathname.includes('/docs')) {
            var path = window.location.pathname;
            var base = path.endsWith('/') ? path : path + '/';
            window.location.replace(base + 'docs/');
          }
        });
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" x2="10" y1="12" y2="12"></line>
            <line x1="8" x2="8" y1="10" y2="14"></line>
            <line x1="15" x2="15.01" y1="13" y2="13"></line>
            <line x1="18" x2="18.01" y1="11" y2="11"></line>
            <rect width="20" height="12" x="2" y="6" rx="6"></rect>
          </svg>
        </div>
        <h1 style="font-size: 20px; font-weight: 700; margin: 0 0 8px 0; color: #f8fafc; letter-spacing: -0.025em;">PortalHub</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0; max-width: 320px;">Loading game library and sandbox...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
